apiVersion: v1
kind: ConfigMap
metadata:
  name: vector-config
  namespace: observability
  labels:
    app.kubernetes.io/name: vector
data:
  vector.yaml: |
    data_dir: /vector-data-dir

    sources:
      docker_container_logs:
        type: file
        include:
          - /var/lib/docker/containers/*/*-json.log
        read_from: beginning

    transforms:
      parse_timepilot_json:
        type: remap
        inputs: [docker_container_logs]
        source: |
          docker_event, docker_error = parse_json(.message)
          if docker_error == null && is_object(docker_event) {
            docker_event = object!(docker_event)
            .message = string!(docker_event.log)
            .stream = docker_event.stream

            application_event, application_error = parse_json(.message)
            if application_error == null && is_object(application_event) {
              . = merge(., object!(application_event))
            }
          }
          .collector = "vector"

      only_timepilot:
        type: filter
        inputs: [parse_timepilot_json]
        condition: '."service.name" == "timepilot"'

    sinks:
      victoria_logs:
        type: elasticsearch
        inputs: [only_timepilot]
        endpoints:
          - http://victoria-logs.observability.svc.cluster.local:9428/insert/elasticsearch/
        mode: bulk
        api_version: v8
        compression: gzip
        healthcheck:
          enabled: false
        query:
          _msg_field: message
          _time_field: timestamp
          _stream_fields: service.name,process.type,stream
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: vector
  namespace: observability
  labels:
    app.kubernetes.io/name: vector
    app.kubernetes.io/component: log-collector
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: vector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vector
        app.kubernetes.io/component: log-collector
    spec:
      serviceAccountName: default
      terminationGracePeriodSeconds: 30
      tolerations:
        - operator: Exists
      containers:
        - name: vector
          image: ghcr.io/vectordotdev/vector:0.59.0-alpine
          imagePullPolicy: IfNotPresent
          args: ["--config-yaml", "/etc/vector/vector.yaml"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsUser: 0
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /etc/vector
              readOnly: true
            - name: docker-containers
              mountPath: /var/lib/docker/containers
              readOnly: true
            - name: data
              mountPath: /vector-data-dir
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: vector-config
        - name: docker-containers
          hostPath:
            path: /var/lib/docker/containers
        - name: data
          hostPath:
            path: /var/lib/vector-timepilot
            type: DirectoryOrCreate
        - name: tmp
          emptyDir: {}
