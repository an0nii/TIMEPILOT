global:
  resolve_timeout: 1m
route:
  receiver: local-inbox
  group_by: [service, alertname]
  group_wait: 5s
  group_interval: 10s
  repeat_interval: 30m
receivers:
  - name: local-inbox
    webhook_configs:
      - url: http://alert-inbox.monitoring.svc.cluster.local:9095/webhook
        send_resolved: true
