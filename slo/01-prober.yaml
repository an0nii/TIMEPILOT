apiVersion: apps/v1
kind: Deployment
metadata:
  name: timepilot-prober
  namespace: timepilot
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: timepilot
      app.kubernetes.io/component: prober
  template:
    metadata:
      labels:
        app.kubernetes.io/name: timepilot
        app.kubernetes.io/component: prober
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9091"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 15
      containers:
        - name: prober
          image: timepilot:k8s
          imagePullPolicy: Never
          args: ["probe"]
          env:
            - name: PROBE_TARGET_URL
              value: http://timepilot.timepilot.svc.cluster.local:8080
            - name: PROBE_ADDR
              value: ":9091"
            - name: PROBE_INTERVAL
              value: 5s
            - name: PROBE_TIMEOUT
              value: 2s
          ports:
            - name: probe-metrics
              containerPort: 9091
          readinessProbe:
            httpGet:
              path: /healthz
              port: probe-metrics
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
