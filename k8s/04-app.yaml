apiVersion: apps/v1
kind: Deployment
metadata:
  name: timepilot
  namespace: timepilot
  labels:
    app.kubernetes.io/name: timepilot
    app.kubernetes.io/component: web
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: timepilot
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: timepilot
        app.kubernetes.io/component: web
    spec:
      terminationGracePeriodSeconds: 15
      initContainers:
        - name: wait-for-migration
          image: postgres:16-alpine@sha256:20edbde7749f822887a1a022ad526fde0a47d6b2be9a8364433605cf65099416
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - until psql -h postgres -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "SELECT to_regclass('public.tasks') IS NOT NULL" | grep -q t; do sleep 2; done
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: timepilot-secrets
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: timepilot-secrets
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: timepilot-secrets
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: timepilot
          image: timepilot:k8s
          imagePullPolicy: Never
          args: ["server"]
          envFrom:
            - configMapRef:
                name: timepilot-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: timepilot-secrets
                  key: DATABASE_URL
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          lifecycle:
            preStop:
              sleep:
                seconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: timepilot
  namespace: timepilot
  labels:
    app.kubernetes.io/name: timepilot
    app.kubernetes.io/component: web
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: timepilot
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080
